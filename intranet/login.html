<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff Login · BuilderK</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{ --orange:#F77F00; --black:#0A0A0A; --light:#FAFAF8; }
    *{ box-sizing:border-box; margin:0; }
    body{ font-family:'DM Sans',system-ui,sans-serif; background:var(--light); color:var(--black);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card{ width:100%; max-width:380px; background:#fff; border:1px solid #ECEAE3;
      border-radius:16px; padding:40px 32px; box-shadow:0 12px 40px rgba(10,10,10,.06); }
    .brand{ font-family:'Outfit',sans-serif; font-weight:800; font-size:24px; letter-spacing:-.02em; }
    .brand b{ color:var(--orange); }
    .sub{ font-size:13px; color:#6B6862; margin-top:6px; }
    h1{ font-family:'Outfit',sans-serif; font-weight:700; font-size:20px; margin:28px 0 4px; }
    label{ display:block; font-size:13px; font-weight:600; margin:20px 0 8px; }
    input[type=password]{ width:100%; padding:13px 14px; font-size:15px; font-family:inherit;
      border:1.5px solid #DAD7CF; border-radius:10px; background:#fff; outline:none; }
    input[type=password]:focus{ border-color:var(--orange); }
    button{ width:100%; margin-top:24px; padding:14px; font-size:15px; font-weight:600; font-family:'Outfit',sans-serif;
      color:#fff; background:var(--orange); border:0; border-radius:10px; cursor:pointer; }
    button:hover{ filter:brightness(.96); }
    button:focus-visible{ outline:2px solid var(--black); outline-offset:2px; }
    .err{ display:none; margin-top:18px; padding:11px 14px; border-radius:9px;
      background:#FDECEC; color:#B42318; font-size:13px; font-weight:500; }
    .err.show{ display:block; }
    .foot{ margin-top:24px; font-size:11px; color:#6B6862; text-align:center; line-height:1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">BUILDER<b>K</b></div>
    <div class="sub">Internal Operating System</div>
    <h1>Staff sign-in</h1>
    <p id="err" class="err">Incorrect password. Try again.</p>
    <form method="POST" action="/intranet/login" autocomplete="off">
      <input type="hidden" name="next" id="next" value="/intranet" />
      <label for="password">Staff password</label>
      <input type="password" id="password" name="password" required autofocus />
      <button type="submit">Enter</button>
    </form>
    <p class="foot">Builders Knowledge Development Inc. · CGC&nbsp;#1537163 · (239)&nbsp;230-4868<br>For BuilderK staff only.</p>
  </main>
  <script>
    var p = new URLSearchParams(location.search);
    var next = p.get('next');
    if (next && next.charAt(0) === '/') document.getElementById('next').value = next;
    if (p.get('e')) document.getElementById('err').classList.add('show');
  </script>
</body>
</html>
